[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inversereserve"
version = "0.2.0"
description = "Stack-aware recovery-capacity enforcement for GUI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy==2.5.3", "Pillow==12.3.0", "PyYAML==6.0.3"]

[project.scripts]
inversereserve = "inversereserve.cli:main"

[project.optional-dependencies]
vision = ["opencv-python-headless==4.14.0.94"]
browser = ["playwright==1.44.0", "browsergym-core==0.14.3", "browsergym-miniwob==0.14.3", "gymnasium==1.3.0"]
inference = ["torch>=2.6,<3", "transformers>=4.57,<6", "accelerate>=1.6,<2"]

[dependency-groups]
dev = ["pytest==9.1.1", "opencv-python-headless==4.14.0.94", "ruff==0.16.10", "mypy==1.20.2", "types-PyYAML==6.0.12.20250915", "build==1.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inversereserve = ["py.typed", "resource_catalog.json", "evidence_data/*.json", "evidence_data/*.tar.gz"]

[tool.pytest.ini_options]
norecursedirs = ["reference", ".*", "build", "dist", "*.egg"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/reference", "reproduce", "build", "dist"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/inversereserve/resources.py", "src/inversereserve/api.py", "src/inversereserve/settings.py", "src/inversereserve/artifacts.py", "src/inversereserve/execution.py", "src/inversereserve/replay.py", "src/inversereserve/reproduction.py", "src/inversereserve/cli.py", "src/inversereserve/preview/types.py", "src/inversereserve/controllers/envelope_policy.py", "src/inversereserve/core/recovery_capacity.py"]
follow_imports = "silent"
